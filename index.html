<script>
// v16-12: old Chrome / WebView (e.g. Chrome 95 on Android 12) can't read colors like #fff1c1cc (#RRGGBBAA) in canvas → crashed the battle.
// If the phone doesn't understand them, translate them to rgba() automatically.
(function(){try{const t=document.createElement('canvas').getContext('2d');t.fillStyle='#ff000080';if(/^rgba/.test(t.fillStyle))return;
  const fix=v=>{if(typeof v!=='string'||v[0]!=='#')return v;let h=v.slice(1);if(h.length===4)h=h.split('').map(c=>c+c).join('');
    if(h.length!==8||/[^0-9a-f]/i.test(h))return v;const n=parseInt(h,16);return 'rgba('+(n>>>24&255)+','+(n>>>16&255)+','+(n>>>8&255)+','+((n&255)/255).toFixed(3)+')';};
  const G=CanvasGradient.prototype,ac=G.addColorStop;G.addColorStop=function(o,c){return ac.call(this,o,fix(c));};
  const C=CanvasRenderingContext2D.prototype;['fillStyle','strokeStyle','shadowColor'].forEach(k=>{const d=Object.getOwnPropertyDescriptor(C,k);if(d&&d.set)Object.defineProperty(C,k,{get:d.get,set:function(v){d.set.call(this,fix(v));},configurable:true});});
}catch(e){}})();
</script>

let vx0=0,vy0=0,vx1=0,vy1=0;

// static background (ground, roads, race track, arrivals, export, yard) is drawn once into
// 512px tiles at the exact screen scale and just copied every frame (no resampling).
// While zooming, the previous tiles are stretched; sharp tiles are rebuilt a few per frame.
const BG={lv:new Map(),cur:null,lvP:-1,lastSc:0,stableT:0},TP=512,BG_MAXT=34;
function bgTile(L,i,j){
  const o=document.createElement('canvas');o.width=o.height=TP;const g=o.getContext('2d',{alpha:false});

function bgPaint(g,sc,det,px,py,pw,ph){
  // paints the static layer: device pixel (px,py) of the canvas = world point (px/sc,py/sc)
  const sX=X,sD=DET,a=vx0,b=vy0,c=vx1,d=vy1;X=g;DET=det;
  vx0=px/sc-2;vy0=py/sc-2;vx1=(px+pw)/sc+2;vy1=(py+ph)/sc+2;
  g.setTransform(sc,0,0,sc,-px,-py);
  const sP=PASS;
  try{drawGround();drawRace();drawArrival();drawExport();drawYard();drawCollection();drawSoon();
    PASS='static';drawPartsGround();STIDS.forEach(drawGarage);drawOffice();drawPartsBuilding();drawSecurity();}catch(e){console.error(e);}
  PASS=sP;X=sX;DET=sD;vx0=a;vy0=b;vx1=c;vy1=d;}
// one small picture of the whole map, used instantly while zooming (no redraw cost)
const OV={sc:.5,x0:-400,y0:-700,c:null};
function ovBuild(){const w=Math.ceil((W+800)*OV.sc),h=Math.ceil((H+1400)*OV.sc),o=document.createElement('canvas');o.width=w;o.height=h;
  bgPaint(o.getContext('2d',{alpha:false}),OV.sc,false,OV.x0*OV.sc,OV.y0*OV.sc,w,h);OV.c=o;}
function ovDraw(sc){const k=sc/OV.sc;X.drawImage(OV.c,Math.round((OV.x0-camX)*sc),Math.round(TOP*DPR+(OV.y0-camY)*sc),OV.c.width*k,OV.c.height*k);}
function bgCount(){let n=0;for(const L of BG.lv.values())n+=L.t.size;return n;}
function bgDraw(L,sc,budget,onlyHave,count){
  // draws level L at current scale sc; returns how many visible tiles are missing
  const k=sc/L.sc,i0=Math.floor(vx0*L.sc/TP),j0=Math.floor(vy0*L.sc/TP),i1=Math.floor(vx1*L.sc/TP),j1=Math.floor(vy1*L.sc/TP);
  const ox=-camX*sc,oy=TOP*DPR-camY*sc;let miss=0;
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const key=i+','+j;let c=L.t.get(key);
    if(!c){if(!onlyHave&&budget.n>0&&(budget.n>=99||performance.now()<budget.until)){c=bgTile(L,i,j);L.t.set(key,c);budget.n--;}else{miss++;continue;}}
    if(count)continue;
    if(k===1)X.drawImage(c,Math.round(ox+i*TP),Math.round(oy+j*TP));
    else{const x0=Math.round(ox+i*TP*k),y0=Math.round(oy+j*TP*k),x1=Math.round(ox+(i+1)*TP*k),y1=Math.round(oy+(j+1)*TP*k);X.drawImage(c,x0,y0,x1-x0,y1-y0);}}
  return miss;}
function drawBG(){
  const sig=JSON.stringify(G.lv)+G.rep+'|'+(PK.vip?1:0)+'|'+Object.values(IMG).filter(i=>i.ok).length;
  if(BG.lvP!==sig||!OV.c){BG.lv.clear();BG.cur=null;BG.lvP=sig;ovBuild();}
  const sc=Z*DPR,det=DET,now=performance.now();
  if(sc!==BG.lastSc){BG.lastSc=sc;BG.stableT=now;}
  const zooming=now-BG.stableT<250,C=BG.cur&&BG.lv.get(BG.cur);
  X.setTransform(1,0,0,1,0,0);
  if(zooming){
    // while the fingers move: nothing new is drawn, only ready pictures are stretched
    const r=C?sc/C.sc:0,useC=C&&r>.4&&r<3.5;
    // fast pixel stretch (no smoothing) – only for the split second the zoom is moving
    X.imageSmoothingEnabled=true;X.imageSmoothingQuality='low';

    X.imageSmoothingEnabled=true;
  }else{
    const key=sc.toFixed(5)+'|'+det;let L=BG.lv.get(key);if(!L){L={sc,det,t:new Map()};BG.lv.set(key,L);}
    // build missing sharp tiles a few per frame (max ~5 ms); until then the small map picture fills in
    const miss=bgDraw(L,sc,{n:C?2:99,until:now+4},false,true);
    if(miss){ovDraw(sc);if(C&&C!==L)bgDraw(C,sc,null,true,false);}
    bgDraw(L,sc,null,true,false);
    if(!miss)BG.cur=key;
  }
  // keep memory small on phones: drop other levels first, then the oldest tiles
  const keep=BG.cur;
  for(const [k,LL] of BG.lv)if(k!==keep&&!LL.t.size&&k!==(sc.toFixed(5)+'|'+det))BG.lv.delete(k);
  if(bgCount()>BG_MAXT)for(const [k,LL] of BG.lv){if(k!==keep&&k!==(sc.toFixed(5)+'|'+det)){BG.lv.delete(k);if(bgCount()<=BG_MAXT)break;}}

}

const MAPCOV=['dq','sm','pop','team','idl','ros','xp'].map(id=>document.getElementById(id));let touchT=0,coverT=0;
cv.addEventListener('pointerdown',()=>{touchT=performance.now();});addEventListener('pointermove',()=>{touchT=performance.now();},{passive:true});
function mapCover(){const c=document.getElementById('cp');if(c&&c.classList.contains('open'))return 2;for(const e of MAPCOV)if(e&&e.classList.contains('open'))return 1;return 0;}
function frame(now){
  if(started){const idle=window.__BATTLE_ON||mapCover()||!gest&&!zAnim&&Math.abs(vX)<2&&Math.abs(vY)<2&&now-touchT>1500;if(now-last<(idle?31:14.5)){requestAnimationFrame(frame);return;}}
  const raw=(now-last)/1000;last=now;const dt=Math.min(.05,raw);
  if(started){let left=dt*SPD;while(left>0){const s=Math.min(.05,left);update(s);left-=s;}}
  if(zAnim){zAnim.t=Math.min(1,zAnim.t+dt/.22);const e=1-Math.pow(1-zAnim.t,3);zoomAt(zAnim.from+(zAnim.to-zAnim.from)*e,VW/2,TOP+(VH-TOP)/2);if(zAnim.t>=1)zAnim=null;}
  if(!gest&&(Math.abs(vX)>2||Math.abs(vY)>2)){camX+=vX*dt;camY+=vY*dt;clampCam();const f=Math.exp(-dt/.32);vX*=f;vY*=f;}
  if(!started){last=now;requestAnimationFrame(frame);return;}
  if(window.__BATTLE_ON){requestAnimationFrame(frame);return;}
  const cov=mapCover();if(cov){coverT+=raw;if(cov===1&&coverT>.16){coverT=0;render();}hud();perfT=0;perfN=0;perfSum=0;perfJS=0;perfMin=99;}else{coverT=0;
  const t0=performance.now();render();hud();
  // adaptive resolution keeps the map smooth on slower phones
  const js=performance.now()-t0;perfJS+=js;perfSum+=Math.max(js,raw*1000);perfN++;perfT+=raw;perfMin=Math.min(perfMin,raw*1000);
  if(perfT>1.5){
    // if the phone itself caps the screen at 30 fps (battery saver), long frames are not lag: judge only our own work
    const capped=perfMin>26,avg=capped?perfJS/perfN*1.6:perfSum/perfN;
    if(avg>(capped?40:26)&&DPR>MINDPR()){DPR=Math.max(MINDPR(),DPR-.25);capDPR=DPR;capHold=0;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);goodT=0;}
    else if(avg<(capped?24:19)&&DPR<MAXDPR){goodT+=perfT;capHold+=perfT;if(capHold>25)capDPR=9;
      if(goodT>4&&DPR<capDPR){DPR=Math.min(MAXDPR,DPR+.25);cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);goodT=0;}}
    perfT=0;perfN=0;perfSum=0;perfJS=0;perfMin=99;}}
  panelT+=dt;if(panelT>.25){panelT=0;renderPanel();if(dqEl.classList.contains('open'))renderDQ();renderSm();renderTeam();renderIdle();
    if((time|0)%5===0){dqCheck();if(VSUB!==subOn())vipRefresh();}}
  requestAnimationFrame(frame);
}

// =================== LOADER ===================
const lcv=$('lcv'),lg=lcv.getContext('2d');let lp=0,lready=false,lW=0,lH=0;
function sizeLoader(){const d=Math.min(2,window.devicePixelRatio||1);lW=innerWidth;lH=innerHeight;lcv.width=Math.round(lW*d);lcv.height=Math.round(lH*d);lg.setTransform(d,0,0,d,0,0);}
function drawLoader(t){
  const L=IM.loading,g=lg;g.fillStyle='#0b1420';g.fillRect(0,0,lW,lH);
  if(!IMG.loading.ok){g.fillStyle='#ffb300';g.font='900 28px system-ui';g.textAlign='center';g.fillText('TORQUE EMPIRE',lW/2,lH/2-20);g.fillStyle='#fff';g.font='700 16px system-ui';g.fillText(lready?'TAP TO PLAY':'Loading... '+Math.floor(lp)+'%',lW/2,lH/2+20);return;}
  let k=Math.max(lW/L.w,lH/L.h);const ox=(lW-L.w*k)/2;let oy=(lH-L.h*k)/2;if(oy<0)oy=Math.max(oy,lH-L.h*k);
  g.drawImage(IMG.loading.el,ox,oy,L.w*k,L.h*k);
  g.save();g.translate(ox,oy);g.scale(k,k);
  const [bx0,by0,bx1,by1]=L.bar,ix=bx0+7,iy=by0+7,iw=bx1-bx0-14,ih=by1-by0-14,fw=Math.max(ih,iw*lp/100);
  g.save();rrG(g,ix,iy,fw,ih,ih/2);g.clip();
  const gr=g.createLinearGradient(0,iy,0,iy+ih);gr.addColorStop(0,'#ffe066');gr.addColorStop(.5,'#ffa000');gr.addColorStop(1,'#e65100');g.fillStyle=gr;g.fillRect(ix,iy,fw,ih);
  g.fillStyle='rgba(255,255,255,.22)';const off=(t*60)%40;for(let x=ix-60+off;x<ix+fw+40;x+=40){g.beginPath();g.moveTo(x,iy+ih);g.lineTo(x+18,iy+ih);g.lineTo(x+18+ih,iy);g.lineTo(x+ih,iy);g.closePath();g.fill();}
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(ix,iy+4,fw,5);g.restore();
  g.shadowColor='#ffb300';g.shadowBlur=20;g.fillStyle='rgba(255,236,170,.9)';g.beginPath();g.arc(ix+fw-ih/2,iy+ih/2,ih*.32,0,7);g.fill();g.shadowBlur=0;
  const [tx,ty]=L.txt;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  if(lready){const p=.5+.5*Math.sin(t*5);g.font='900 44px system-ui';g.lineWidth=8;g.strokeStyle='#1b0d00';g.strokeText('TAP TO PLAY',tx,ty);g.fillStyle='rgb(255,'+Math.round(200+40*p)+','+Math.round(60+90*p)+')';g.fillText('TAP TO PLAY',tx,ty);}
  else{g.font='900 40px system-ui';g.lineWidth=7;g.strokeStyle='#0b1117';g.strokeText('Loading... '+Math.floor(lp)+'%',tx,ty);g.fillStyle='#fff';g.fillText('Loading... '+Math.floor(lp)+'%',tx,ty);}
  g.restore();
}
function rrG(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function startLoader(){
  sizeLoader();addEventListener('resize',sizeLoader);const t0=performance.now();
  const assetsDone=()=>Object.values(IMG).every(i=>i.ok||i.bad);
  (function lf(now){if(started)return;const t=(now-t0)/1000;
    const cap=assetsDone()?100:88;lp=Math.min(cap,lp+.9);if(lp>=100)lready=true;
    drawLoader(t);requestAnimationFrame(lf);})(t0);
  $('loader').onclick=()=>{if(!lready||started)return;$('loader').classList.add('hide');started=true;last=performance.now();setTimeout(()=>toast('Drag to move · pinch to zoom · tap a building or a car',4500),600);if(Date.now()-G.idle>6e5&&idleNow().money>0)setTimeout(()=>popIdle(true),900);};
}
